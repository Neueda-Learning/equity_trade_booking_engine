services:
  db:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-storage-engine=InnoDB
    environment:
      MYSQL_DATABASE: equity_booking
      MYSQL_USER: equity_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-local_app_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-equity-booking-backend:walking-skeleton}
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:mysql://db:3306/equity_booking?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-equity_app}
      DB_PASSWORD: ${DB_PASSWORD:-local_app_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-mock}
      MARKET_DATA_FRESH_TTL: ${MARKET_DATA_FRESH_TTL:-60s}
      MARKET_DATA_RETENTION_TTL: ${MARKET_DATA_RETENTION_TTL:-24h}
      DASHBOARD_SNAPSHOT_SCHEDULING_ENABLED: ${DASHBOARD_SNAPSHOT_SCHEDULING_ENABLED:-true}
      DASHBOARD_SNAPSHOT_INTERVAL: ${DASHBOARD_SNAPSHOT_INTERVAL:-15m}
      DASHBOARD_SNAPSHOT_INITIAL_DELAY: ${DASHBOARD_SNAPSHOT_INITIAL_DELAY:-15m}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:8080/api/health | grep -q '\"status\":\"UP\"'",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-equity-booking-frontend:walking-skeleton}
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
