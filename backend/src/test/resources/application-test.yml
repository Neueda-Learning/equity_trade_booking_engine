spring:
  datasource:
    url: jdbc:h2:mem:equity_booking;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      connect-timeout: 100ms
      timeout: 100ms

management:
  health:
    redis:
      enabled: false

dashboard:
  snapshots:
    scheduling-enabled: false
