spring:
  application:
    name: equity-trade-booking-engine
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/equity_booking?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:equity_app}
    password: ${DB_PASSWORD:local_app_password}
    hikari:
      connection-timeout: 2000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
      path-mapping:
        health: health
  endpoint:
    health:
      show-details: never

server:
  port: 8080
