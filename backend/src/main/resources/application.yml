spring:
  application:
    name: equity-trade-booking-engine
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/equity_booking?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:equity_app}
    password: ${DB_PASSWORD:local_app_password}
    hikari:
      connection-timeout: 2000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_COMMAND_TIMEOUT:1s}
      repositories:
        enabled: false

market-data:
  provider: ${MARKET_DATA_PROVIDER:mock}
  fresh-ttl: ${MARKET_DATA_FRESH_TTL:60s}
  retention-ttl: ${MARKET_DATA_RETENTION_TTL:24h}
  mock-window: ${MARKET_DATA_MOCK_WINDOW:60s}

management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
      path-mapping:
        health: health
  endpoint:
    health:
      show-details: never

server:
  port: 8080
